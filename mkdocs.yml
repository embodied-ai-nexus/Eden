site_name: Eden
site_description: "Embodied-AI Development Environments Nexus — Vectorized RL environments for robot learning"
site_url: https://embodied-ai-nexus.github.io/Eden
repo_url: https://github.com/embodied-ai-nexus/Eden
repo_name: embodied-ai-nexus/Eden
edit_uri: edit/main/docs/
copyright: "Copyright &copy; 2025 Eden Authors"
theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo/eden-mark.svg
  favicon: assets/logo/eden-mark.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
extra_css:
  - assets/stylesheets/extra.css
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # check_paths turns a missing/renamed `--8<--` snippet into a build error, not a silent blank.
  # (api/terms/catalog.md is generated in full by `python -m eden.managers.catalog`; the wheel ships
  # only an index of it at eden/resources/term_catalog.md.)
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
plugins:
  - search
  - section-index
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # `eden.extensions` and `eden.options.extensions` are PEP 420 namespace
          # packages, so Griffe can't auto-discover them from the repo root.
          # Listing each child explicitly lets mkdocstrings load their contents.
          paths:
            - "."
            - "eden/extensions"
            - "eden/options/extensions"
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            allow_inspection: true
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            group_by_category: true
            show_category_heading: true
            docstring_style: numpy
            docstring_section_style: spacy
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            show_if_no_docstring: true
            filters:
              - "!^_"
              - "!^model_"
              - "^__init__"
# The hook lowers griffe's pre-existing docstring warnings to DEBUG, so `mkdocs build --strict` (CI, and the deploy in
# .github/workflows/docs.yml) fails on every other warning: the `validation:` ones below above all.
hooks:
  - docs/hooks/griffe_warnings.py
exclude_docs: |
  /hooks/
# Report links to missing pages, missing anchors and pages left out of the nav as warnings.
validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
