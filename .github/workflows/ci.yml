name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Cancel superseded PR runs, but never cancel main's runs — every main commit
# must keep a completed CI record.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7" # pinned: a uv release must not change CI resolution unannounced
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-
      - name: Run pre-commit on all files
        run: uvx pre-commit run --all-files --show-diff-on-failure
  import:
    name: Install + import (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7" # pinned: a uv release must not change CI resolution unannounced
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # --no-default-groups skips the dev dependency-group (introduced in the
      # packaging PR; a no-op until it merges). NOTE: pulls the default
      # (CUDA-bundled) torch wheels (~3GB) — fits the runner disk but is slow on
      # cold cache; a CPU torch index for CI is a tracked follow-up (C6).
      - name: Sync core dependencies
        run: uv sync --no-default-groups
      - name: Import eden
        run: uv run python -c "import eden; print(eden.__file__)"
      - name: CLI entrypoint responds
        run: uv run eden --help
      # `eden list` walks TASK_REGISTRY, proving the lazy task-import paths
      # resolve — much stronger than argparse wiring alone.
      - name: Task registry resolves
        run: uv run eden list
  docs:
    name: Docs (mkdocs build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7" # pinned: a uv release must not change CI resolution unannounced
          python-version: "3.12"
          enable-cache: true
      # The docs extra's packages only, at pinned versions (see the action).
      - uses: ./.github/actions/docs-toolchain
      # --strict fails on any warning: a link to a missing page or anchor, or a
      # page left out of the nav. The pre-existing griffe docstring warnings are
      # lowered to DEBUG by docs/hooks/griffe_warnings.py, so they do not count.
      - name: Build docs
        run: .venv/bin/mkdocs build --strict
  # Eden's rsl_rl algorithms, runners and runner mixins against every rsl-rl-lib major the `rsl-rl-lib>=3.0` pin
  # admits. The lock installs 5.5.2; `uv run --with` layers another release over it for the test run only. The tests
  # run on CPU (eden.init's default backend), so no GPU runner is needed.
  rsl-rl:
    name: rsl_rl tests (rsl-rl-lib ${{ matrix.rsl-rl-lib }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - rsl-rl-lib: "6.0.0"
            tests: tests/envs/wrappers/test_rsl_rl_compat.py tests/learning/wrappers/rsl_rl tests/envs/wrappers/test_rsl_rl_env.py
          - rsl-rl-lib: "5.5.2"
            tests: tests/envs/wrappers/test_rsl_rl_compat.py tests/learning/wrappers/rsl_rl tests/envs/wrappers/test_rsl_rl_env.py
          # Three test_rsl_rl_env.py tests fail under 4.x, and are deselected until fixed: the legacy-checkpoint
          # converter writes 5.x parameter names (distribution.std_param / log_std_param) where a 4.x actor has
          # std / log_std, and one test deletes a runner-dict key only 5.x and 6.x have.
          - rsl-rl-lib: "4.0.1"
            tests: >-
              tests/envs/wrappers/test_rsl_rl_compat.py tests/learning/wrappers/rsl_rl tests/envs/wrappers/test_rsl_rl_env.py --deselect tests/envs/wrappers/test_rsl_rl_env.py::test_a_distillation_runner_converts_a_legacy_checkpoint_into_its_teacher --deselect tests/envs/wrappers/test_rsl_rl_env.py::test_a_legacy_checkpoint_is_converted_beside_the_original_and_loads --deselect tests/envs/wrappers/test_rsl_rl_env.py::test_a_runner_dict_without_std_type_refuses_a_legacy_checkpoint_and_passes_a_current_one
          # test_rsl_rl_env.py assumes the split actor/critic layout of 4.x and later throughout, so 3.x runs the rest.
          - rsl-rl-lib: "3.3.0"
            tests: tests/envs/wrappers/test_rsl_rl_compat.py tests/learning/wrappers/rsl_rl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7" # pinned: a uv release must not change CI resolution unannounced
          python-version: "3.12"
          enable-cache: true
      # The default groups, for pytest.
      - name: Sync dependencies
        run: uv sync
      # The robots, motion clips and meshes these tests build come from the Hugging Face hub on first use.
      - name: Cache Eden assets
        uses: actions/cache@v4
        with:
          path: ~/.cache/eden/assets
          key: eden-assets-rsl-rl-${{ hashFiles('eden/utils/assets.py') }}
          restore-keys: eden-assets-rsl-rl-
      - name: Run the rsl_rl tests
        run: uv run --no-sync --with rsl-rl-lib==${{ matrix.rsl-rl-lib }} pytest -q ${{ matrix.tests }}
